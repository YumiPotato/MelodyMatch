<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MelodyMatch - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="/MelodyMatch/Frontend/css/auth.css?v=20260821">
    <style>
        /* layout tweaks for simplified login */
        /* card sizing: set to requested 520px max width */
        .register-card {
            max-width: 520px;
            margin: 1rem auto;
            padding: 2rem;
            position: relative;
        }

        .login-simple .field-group {
            margin-bottom: 1rem;
        }

        .login-simple .field-group input {
            width: 100%;
            box-sizing: border-box;
        }

        .button-row {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        /* create-account styled as a subtle button without underline */
        .ghost-button {
            /* match submit-button visual style */
            background: linear-gradient(135deg, #f472b6, #db2777);
            color: white;
            box-shadow: 0 8px 18px rgba(219, 39, 119, 0.25);
            border: none;
            padding: 12px 20px;
            border-radius: 11px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .ghost-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(219, 39, 119, 0.32);
        }

        /* place login button on the right side */
        .login-simple .form-actions {
            justify-content: flex-end;
        }

        .login-simple .submit-button {
            width: auto;
            max-width: none;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="logo" aria-label="MelodyMatch home">
            <div class="logo-mark" aria-hidden="true"><span class="mark-wave">♪</span></div>
            <div class="logo-text">Melody<span>Match</span></div>
        </div>

        <div class="register-card">

            <div class="title-section">
                <h1>Welcome back</h1>
                <p>Log in and pick up where your sound left off.</p>
            </div>

            <!-- Simplified login: only two vertical textboxes -->
            <form id="loginForm" class="detail-form active login-simple" action="homepage.html" method="get">

                <div class="field-group">
                    <label for="loginEmail">Email address</label>
                    <input id="loginEmail" name="email" type="email" placeholder="you@example.com" autocomplete="email"
                        required>
                </div>

                <div class="field-group">
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" name="password" type="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>

                <div class="form-actions button-row">
                    <button type="submit" class="submit-button">Log in</button>
                </div>

            </form>

            <div class="login-section" style="margin-top:18px; text-align:center;">

                <span>Don't have an account?</span>
                <a href="register.html" class="login-link">Create an account</a>

                <div class="home-link-wrap">
                    <a href="homepage.html" class="home-link">Return to homepage</a>
                </div>

            </div>

        </div>

        <div class="footer">© 2026 MelodyMatch · Made for music lovers</div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            // placeholder authentication flow
            // allow the form to submit normally to homepage.html (method=get)
        });
    </script>

</body>

</html>
