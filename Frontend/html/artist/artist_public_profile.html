<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Discover an artist and listen to their latest releases on MelodyMatch.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist | MelodyMatch</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/MelodyMatch/Frontend/css/homepage.css?v=20261102-3">
    <link rel="stylesheet" href="/MelodyMatch/Frontend/css/listener-profile.css?v=20261102-1">
    <link rel="stylesheet" href="/MelodyMatch/Frontend/css/artist-profile.css?v=20261103-1">
    <link rel="stylesheet" href="/MelodyMatch/Frontend/css/music-library.css?v=20261104-1">
</head>

<body>
    <div class="page-shell">
        <aside class="sidebar">
            <div class="logo" aria-label="MelodyMatch home">
                <div class="logo-mark" aria-hidden="true"><span class="mark-wave">♪</span></div>
                <div class="logo-text">Melody<span>Match</span></div>
            </div>
            <nav aria-label="Artist profile navigation">
                <a href="/MelodyMatch/Frontend/html/listener/listener_homepage.html">← Return to homepage</a>
                <a href="/MelodyMatch/Frontend/html/register.html">♫ Discover MelodyMatch</a>
            </nav>
            <div class="profile-sidebar-note"><span class="profile-status-dot" aria-hidden="true"></span>Artist profile
            </div>
        </aside>

        <main class="main-content profile-content">
            <header class="topbar">
                <div class="profile-breadcrumb">MelodyMatch <span aria-hidden="true">/</span> Artist</div>
                <button class="theme-toggle" type="button" id="themeToggle" aria-label="Switch colour theme">🌙
                    Dark</button>
            </header>

            <section class="profile-overview public-artist-overview">
                <div class="profile-avatar">
                    <img id="publicArtistPicture" alt="" hidden>
                    <span id="publicArtistInitial">♫</span>
                </div>
                <div class="profile-identity">
                    <p class="profile-kicker">MELODYMATCH ARTIST</p>
                    <h1 id="publicArtistName">Loading artist…</h1>
                    <p class="profile-username" id="publicArtistGenre">Artist</p>
                    <p class="artist-biography" id="publicArtistBiography"></p>
                    <div class="public-social-links" id="publicSocialLinks" aria-label="Artist social links"></div>
                </div>
            </section>

            <section class="section public-releases" aria-labelledby="publicReleasesHeading">
                <div class="section-title">
                    <h3 id="publicReleasesHeading">Releases</h3>
                    <span class="public-release-count" id="publicReleaseCount"></span>
                </div>
                <div class="song-sort-control">
                    <span>Sort releases</span>
                    <div id="publicSongSort" role="group" aria-label="Sort artist releases">
                        <button type="button" data-sort="popular" aria-pressed="false">Most Popular</button>
                        <button type="button" data-sort="oldest" aria-pressed="false">Oldest</button>
                        <button type="button" data-sort="newest" aria-pressed="true">Newest</button>
                    </div>
                </div>
                <div class="public-song-list" id="publicSongList" role="list" aria-live="polite">
                    <p class="empty-state">Loading artist releases…</p>
                </div>
                <p class="public-song-message" id="publicSongMessage" role="status" aria-live="polite"></p>
            </section>
        </main>
    </div>

    <script src="/MelodyMatch/Frontend/js/music-player.js"></script>
    <script src="/MelodyMatch/Frontend/js/app-navigation.js"></script>
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const savedTheme = localStorage.getItem('melodyMatchTheme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        function applyTheme(theme) {
            document.documentElement.dataset.theme = theme;
            themeToggle.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
        }

        applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));
        themeToggle.addEventListener('click', () => {
            const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('melodyMatchTheme', theme);
            applyTheme(theme);
        });

        function addSocialLink(container, label, value) {
            if (!value) return;
            try {
                const url = new URL(value);
                if (!['http:', 'https:'].includes(url.protocol)) return;
                const link = document.createElement('a');
                link.href = url.href;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.textContent = label;
                container.append(link);
            } catch (error) {
                console.error('Could not display public artist social link.', error);
            }
        }

        let publicSongs = [];
        let publicSongSort = 'newest';
        let publicCsrfToken = '';
        const publicSongMessage = document.getElementById('publicSongMessage');

        function buildSongCard(song) {
            const article = document.createElement('article');
            article.className = 'public-song-row';
            article.setAttribute('role', 'listitem');
            const cover = document.createElement('div');
            cover.className = 'public-song-cover';
            if (song.coverUrl) {
                const image = document.createElement('img');
                image.src = song.coverUrl;
                image.alt = '';
                cover.append(image);
            } else {
                cover.textContent = '♫';
                cover.setAttribute('aria-hidden', 'true');
            }

            const details = document.createElement('div');
            details.className = 'public-song-details';
            const heading = document.createElement('h2');
            heading.textContent = song.title;
            const releaseDate = new Date(`${song.releaseDate}T00:00:00`);
            const metadata = document.createElement('div');
            metadata.className = 'public-song-metadata';
            [
                ['Genre', song.genre],
                ['Mood', song.mood],
                ['Language', song.language],
                ['Released', Number.isNaN(releaseDate.getTime())
                    ? song.releaseDate
                    : releaseDate.toLocaleDateString()]
            ].filter(([, value]) => value).forEach(([label, value]) => {
                const line = document.createElement('p');
                const name = document.createElement('strong');
                name.textContent = `${label}: `;
                line.append(name, document.createTextNode(value));
                metadata.append(line);
            });
            const stats = document.createElement('p');
            stats.className = 'public-song-stats';
            stats.textContent = `${song.views} views · ${song.likes} likes · ${song.saves} saves`;
            details.append(heading, metadata, stats);

            const actions = document.createElement('div');
            actions.className = 'public-song-actions';
            const playButton = document.createElement('button');
            playButton.type = 'button';
            playButton.className = 'public-song-play';
            playButton.textContent = '▶ Play';
            playButton.disabled = !song.audioUrl;
            playButton.setAttribute('aria-label', `Play ${song.title}`);
            playButton.addEventListener('click', () => {
                window.openMelodyMatchPlayer(publicSongs, song.id, publicCsrfToken);
            });
            const likeButton = document.createElement('button');
            likeButton.type = 'button';
            likeButton.className = 'public-song-reaction';
            likeButton.disabled = !publicCsrfToken;
            const saveButton = document.createElement('button');
            saveButton.type = 'button';
            saveButton.className = 'public-song-reaction';
            saveButton.disabled = !publicCsrfToken;
            const updateButtons = () => {
                likeButton.textContent = `${song.liked ? '♥ Liked' : '♡ Like'} · ${song.likes}`;
                likeButton.setAttribute('aria-pressed', String(Boolean(song.liked)));
                saveButton.textContent = `${song.saved ? '♥ Saved' : '♡ Save'} · ${song.saves}`;
                saveButton.setAttribute('aria-pressed', String(Boolean(song.saved)));
                stats.textContent = `${song.views} views · ${song.likes} likes · ${song.saves} saves`;
            };
            likeButton.addEventListener('click', () =>
                togglePublicReaction(song, 'like_song.php', 'liked', likeButton));
            saveButton.addEventListener('click', () =>
                togglePublicReaction(song, 'save_song.php', 'saved', saveButton));
            updateButtons();
            const detailsLink = document.createElement('a');
            detailsLink.href = `/MelodyMatch/Frontend/html/song_detail.html?song_id=${encodeURIComponent(song.id)}`;
            detailsLink.textContent = 'Song details';
            actions.append(playButton, likeButton, saveButton, detailsLink);
            article.append(cover, details, actions);
            return article;
        }

        async function togglePublicReaction(song, endpoint, reaction, button) {
            if (!publicCsrfToken) {
                publicSongMessage.textContent = 'Sign in to like or save songs.';
                return;
            }
            button.disabled = true;
            try {
                const account = await window.MelodyMatchMusicPlayer.syncAccount();
                if (!account) throw new Error('Sign in again to like or save songs.');
                const response = await fetch(`/MelodyMatch/Backend/php/${endpoint}`, {
                    method: 'POST',
                    headers: {
                        Accept: 'application/json',
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: new URLSearchParams({
                        song_id: String(song.id),
                        csrf_token: publicCsrfToken
                    })
                });
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'This song could not be updated.');
                }
                song[reaction] = result[reaction];
                song[reaction === 'liked' ? 'likes' : 'saves'] =
                    result[reaction === 'liked' ? 'likes' : 'saves'];
                renderPublicSongs();
                if (typeof window.updateMelodyMatchPlayerSong === 'function') {
                    window.updateMelodyMatchPlayerSong(song.id, {
                        [reaction]: song[reaction],
                        [reaction === 'liked' ? 'likes' : 'saves']: song[reaction === 'liked' ? 'likes' : 'saves']
                    });
                }
                publicSongMessage.textContent = result.message;
            } catch (error) {
                console.error('Could not update public artist song reaction.', error);
                publicSongMessage.textContent = error.message || 'This song could not be updated.';
            } finally {
                button.disabled = false;
            }
        }

        function renderPublicSongs() {
            const sort = publicSongSort;
            const songs = [...publicSongs];
            if (sort === 'popular') {
                songs.sort((first, second) =>
                    (second.views + second.likes * 2 + second.saves) -
                    (first.views + first.likes * 2 + first.saves));
            } else {
                songs.sort((first, second) => {
                    const dateDifference = new Date(`${first.releaseDate}T00:00:00`) -
                        new Date(`${second.releaseDate}T00:00:00`);
                    const idDifference = first.id - second.id;
                    return sort === 'oldest' ? dateDifference || idDifference : -dateDifference || -idDifference;
                });
            }
            songList.replaceChildren();
            if (songs.length) {
                songs.forEach(song => songList.append(buildSongCard(song)));
            } else {
                const empty = document.createElement('p');
                empty.className = 'empty-state';
                empty.textContent = 'No songs have been released yet.';
                songList.append(empty);
            }
        }

        document.querySelectorAll('#publicSongSort button').forEach(button => {
            button.addEventListener('click', () => {
                publicSongSort = button.dataset.sort;
                document.querySelectorAll('#publicSongSort button').forEach(option => {
                    option.setAttribute('aria-pressed', String(option === button));
                });
                renderPublicSongs();
            });
        });
        const artistId = new URLSearchParams(window.location.search).get('artist_id');
        const songList = document.getElementById('publicSongList');
        if (!artistId || !/^[1-9]\d*$/.test(artistId)) {
            document.getElementById('publicArtistName').textContent = 'Artist not found';
            songList.innerHTML = '<p class="empty-state">Choose a valid artist profile to preview.</p>';
        } else {
            fetch(`/MelodyMatch/Backend/php/get_public_artist_profile.php?artist_id=${encodeURIComponent(artistId)}`, {
                headers: { Accept: 'application/json' }
            }).then(async response => {
                if (!response.ok) {
                    const result = await response.json();
                    throw new Error(result.message || 'This artist profile could not be loaded.');
                }
                return response.json();
            }).then(data => {
                if (!data.success || !data.profile) {
                    throw new Error(data.message || 'This artist profile could not be loaded.');
                }

                const artist = data.profile;
                publicCsrfToken = artist.csrfToken || '';
                const displayName = artist.artistName || artist.username;
                document.title = `${displayName} | MelodyMatch`;
                document.getElementById('publicArtistName').textContent = displayName;
                document.getElementById('publicArtistGenre').textContent =
                    [artist.genre, artist.language].filter(Boolean).join(' · ') || 'MelodyMatch artist';
                document.getElementById('publicArtistBiography').textContent =
                    artist.biography || 'This artist has not added a biography yet.';
                document.getElementById('publicArtistInitial').textContent =
                    Array.from(displayName)[0] || '♫';
                if (artist.profilePicture) {
                    const image = document.getElementById('publicArtistPicture');
                    image.src = artist.profilePicture;
                    image.alt = `${displayName} profile picture`;
                    image.hidden = false;
                    document.getElementById('publicArtistInitial').hidden = true;
                }

                const socialLinks = document.getElementById('publicSocialLinks');
                addSocialLink(socialLinks, 'YouTube', artist.youtubeUrl);
                addSocialLink(socialLinks, 'TikTok', artist.tiktokUrl);

                publicSongs = Array.isArray(artist.songs) ? artist.songs : [];
                document.getElementById('publicReleaseCount').textContent =
                    `${publicSongs.length} ${publicSongs.length === 1 ? 'release' : 'releases'}`;
                renderPublicSongs();
            }).catch(error => {
                console.error('Could not load public artist profile.', error);
                document.getElementById('publicArtistName').textContent = 'Artist profile unavailable';
                songList.innerHTML = '';
                const message = document.createElement('p');
                message.className = 'empty-state';
                message.textContent = error.message || 'Artist releases could not be loaded.';
                songList.append(message);
            });
        }
    </script>
</body>

</html>
